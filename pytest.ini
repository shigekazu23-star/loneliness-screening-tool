; ---- pytest configuration ----
; Registers the test-level markers used across the suite so that a level can
; be selected on its own, for example:
;   python -m pytest -m "unit or integration"     (fast, runs in CI)
;   python -m pytest -m acceptance                (slow, needs a browser)
;
; The levels follow the testing pyramid: the fast lower levels run on every
; push, while the browser-driven acceptance tests run before a release.

[pytest]
markers =
    unit: pure-function tests with no framework or database (M4 scoring, M6 trend)
    integration: API routes exercised together with the database and auth
    acceptance: browser-driven end-to-end scenarios that also accept requirements
    edge: boundary-value cases at a decision threshold
